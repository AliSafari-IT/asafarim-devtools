<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="Verdana, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#131a3a"/>
      <stop offset="1" stop-color="#1c1140"/>
    </linearGradient>
    <linearGradient id="aGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="trailGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="badgeClip">
      <rect x="20" y="20" width="320" height="320" rx="72"/>
    </clipPath>
  </defs>

  <!-- ===== Icon badge (scaled-down version of logo-icon.svg) ===== -->
  <rect x="20" y="20" width="320" height="320" rx="72" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="320" height="320" rx="72" fill="none"
        stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2"/>

  <g clip-path="url(#badgeClip)">
    <g stroke="#94a3b8" stroke-opacity="0.10" stroke-width="1.5">
      <path d="M20 95 H340 M20 180 H340 M20 265 H340 M100 20 V340 M180 20 V340 M260 20 V340"/>
    </g>
    <g fill="#e2e8f0">
      <circle cx="68" cy="64" r="3" opacity="0.7"/>
      <circle cx="300" cy="52" r="2.5" opacity="0.5"/>
      <circle cx="316" cy="130" r="3" opacity="0.65"/>
      <circle cx="52" cy="210" r="2.5" opacity="0.45"/>
      <circle cx="306" cy="300" r="3" opacity="0.6"/>
      <circle cx="88" cy="306" r="2.5" opacity="0.5"/>
    </g>

    <ellipse cx="180" cy="168" rx="146" ry="132" fill="url(#glow)"/>

    <path d="M8 258 C 70 236, 110 290, 180 268 S 296 224, 352 244"
          fill="none" stroke="url(#trailGrad)" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="0.1 15"/>
    <g transform="translate(306 240) scale(0.66)">
      <path d="M0 -34 C -19 -34, -30 -21, -30 -8 C -30 8, 0 30, 0 30 C 0 30, 30 8, 30 -8 C 30 -21, 19 -34, 0 -34 Z"
            fill="#fbbf24"/>
      <circle cx="0" cy="-9" r="10" fill="#0b1026"/>
      <circle cx="0" cy="-9" r="5" fill="#2dd4bf"/>
    </g>

    <g fill="url(#aGrad)">
      <path d="M180 74 L110 268 L148 268 L180 162 Z"/>
      <path d="M180 74 L250 268 L212 268 L180 162 Z"/>
      <path d="M180 38 L194 88 L180 74 L166 88 Z" fill="#fbbf24"/>
      <circle cx="180" cy="38" r="6" fill="#2dd4bf"/>
    </g>

    <g stroke="#e2e8f0" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M141 208 L120 227 L141 246"/>
      <path d="M219 208 L240 227 L219 246"/>
    </g>
    <path d="M189 200 L170 252" stroke="#fbbf24" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- ===== Wordmark ===== -->
  <text x="392" y="176" font-size="96" font-weight="bold" letter-spacing="2"
        fill="url(#wordGrad)">asafarim</text>

  <!-- Divider flourish: journey dashes under the wordmark -->
  <path d="M396 212 H1140" stroke="url(#trailGrad)" stroke-width="5"
        stroke-linecap="round" stroke-dasharray="0.1 18"/>

  <text x="398" y="282" font-size="44" font-weight="bold" letter-spacing="18"
        fill="#fbbf24">DEV</text>
  <text x="542" y="282" font-size="44" font-weight="bold" letter-spacing="18"
        fill="#2dd4bf">TOOLS</text>

  <!-- Code brackets framing the subtitle -->
  <text x="358" y="284" font-size="46" fill="#64748b">{</text>
  <text x="820" y="284" font-size="46" fill="#64748b">}</text>
</svg>
